header:after{content:"";position:absolute;bottom:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#f8b65c,#fff0c3,#f24239,#f8b65c);opacity:.9}
h1{margin:0;color:white;font-size:clamp(32px,4.4vw,58px);line-height:1.04;letter-spacing:-1.8px;text-shadow:0 4px 22px #000}
.sub{color:#f3e6d7;font-size:17px;margin-top:13px;max-width:720px}
.controls{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
button{border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:12px 17px;font-weight:850;cursor:pointer;background:#fff8eb;color:#29212a;box-shadow:0 7px 18px rgba(0,0,0,.28);font-size:15px}
button.secondary{background:#2a303b;color:#fff3e3}button.danger{background:#b62a35;color:white}button:hover{transform:translateY(-1px)}
main{padding:12px 34px 46px;position:relative;z-index:1}
.status{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0 16px}
.pill{background:#242a34;border:1px solid #43434a;border-radius:999px;padding:10px 16px;font-weight:750;color:#fff1df}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:10px;background:#1d222c;border:1px solid #41424a;border-radius:20px;padding:19px;box-shadow:0 15px 38px rgba(0,0,0,.25)}
.tile{aspect-ratio:1/1;border-radius:11px;border:1px solid #5b5c62;display:flex;align-items:center;justify-content:center;background:#f9f5ec;font-size:22px;font-weight:900;color:#20212b;cursor:pointer;transition:.15s}
.tile:hover{background:#ffe3bd;transform:translateY(-2px);border-color:#f3a245}
.tile.used{background:linear-gradient(135deg,#db3b35,#fa9c32);color:#fff;text-decoration:line-through;border-color:#ffbf79;box-shadow:0 0 0 2px rgba(255,185,92,.28)}
.modal{position:fixed;inset:0;background:rgba(6,8,13,.83);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}.modal.open{display:flex}
.card{width:min(960px,96vw);background:#fffaf3;color:#16191f;border-radius:23px;padding:28px;box-shadow:0 35px 90px rgba(0,0,0,.48);border-top:7px solid #ed8d34}
.cardTop{display:flex;justify-content:space-between;gap:18px;align-items:start;border-bottom:2px solid #f2d1b5;padding-bottom:18px;margin-bottom:18px}
.num{font-size:18px;color:#b82b33;font-weight:950;text-transform:uppercase;letter-spacing:.8px}.close{background:#f9e8de;color:#84292a;box-shadow:none;border:1px solid #efb7a1}
.question{font-size:clamp(28px,4vw,48px);line-height:1.1;font-weight:950;margin:18px 0 20px}
.answer{display:none;background:#fff0db;border-left:6px solid #f39b35;padding:18px;border-radius:12px;font-size:22px;line-height:1.45;color:#31221c}.answer.show{display:block}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.footerLogo{position:fixed;right:24px;bottom:18px;width:105px;opacity:.88;pointer-events:none;z-index:2}.footerLogo img{display:block;width:100%;height:auto}
@media(max-width:700px){header{padding:26px 18px;min-height:240px}main{padding-left:18px;padding-right:18px}.grid{grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;padding:12px}.tile{font-size:18px}.footerLogo{width:82px;right:14px;bottom:12px}}
</style>
</head>

const KEY='recuperatorio_primer_parcial_tnd_v1';
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function defaultState(){return{order:shuffle([...Array(QUESTIONS.length).keys()]),used:[]}}
function loadState(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.order&&s.order.length===QUESTIONS.length)return s;}catch(e){}return defaultState();}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
let state=loadState();
function render(){const grid=document.getElementById('grid');grid.innerHTML='';state.order.forEach((qIdx,boardIdx)=>{const b=document.createElement('div');b.className='tile'+(state.used.includes(boardIdx)?' used':'');b.textContent=boardIdx+1;b.onclick=()=>openQuestion(boardIdx);grid.appendChild(b);});document.getElementById('counter').textContent=state.used.length+' usadas';document.getElementById('total').textContent=QUESTIONS.length+' preguntas';}
function openQuestion(boardIdx){const q=QUESTIONS[state.order[boardIdx]];if(!state.used.includes(boardIdx)){state.used.push(boardIdx);save();render();}document.getElementById('modalNum').textContent='Número '+(boardIdx+1);document.getElementById('realId').textContent='ID interno: N'+String(state.order[boardIdx]+1).padStart(3,'0');document.getElementById('question').textContent=q.q;document.getElementById('answer').textContent=q.a;document.getElementById('answer').classList.remove('show');document.getElementById('showAnswer').textContent='Mostrar respuesta esperada';document.getElementById('modal').classList.add('open');}

document.getElementById('close').onclick=closeModal;document.getElementById('markClose').onclick=closeModal;document.getElementById('showAnswer').onclick=()=>{const ans=document.getElementById('answer');const show=!ans.classList.contains('show');ans.classList.toggle('show',show);document.getElementById('showAnswer').textContent=show?'Ocultar respuesta':'Mostrar respuesta esperada';};
