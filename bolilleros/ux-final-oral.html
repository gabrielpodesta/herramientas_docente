<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Final Oral - Diseño de Experiencia de Usuario</title>
  <style>
:root {
  --bg: #f5f6fa;
  --surface: #ffffff;
  --surface-soft: #eef1f7;
  --ink: #1f2937;
  --muted: #6b7280;
  --blue: #3e52f5;
  --violet: #8b1cff;
  --violet-dark: #4c0daa;
  --violet-soft: #ede4ff;
  --line: #d9deea;
  --shadow: 0 18px 45px rgba(48, 25, 100, .16);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(circle at 82% 6%, rgba(139, 28, 255, .16), transparent 24%),
    radial-gradient(circle at 6% 94%, rgba(62, 82, 245, .12), transparent 28%),
    linear-gradient(180deg, #ffffff 0%, var(--bg) 44%, #eef1f7 100%);
}

.top {
  padding: 34px 42px 18px;
  display: flex;
  gap: 24px;
  align-items: flex-end;
  justify-content: space-between;
  flex-wrap: wrap;
}

h1 {
  margin: 0;
  font-size: clamp(36px, 5vw, 70px);
  line-height: .92;
  letter-spacing: -2.5px;
  color: var(--blue);
}

.subtitle {
  margin: 12px 0 0;
  color: var(--muted);
  font-size: 18px;
  font-weight: 650;
}

.controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

button {
  border: 0;
  border-radius: 18px;
  padding: 13px 18px;
  font-size: 15px;
  font-weight: 850;
  cursor: pointer;
  color: #ffffff;
  background: linear-gradient(180deg, #9d35ff, var(--violet));
  box-shadow: 0 12px 25px rgba(139, 28, 255, .22);
  transition: .14s ease;
}

button:hover {
  transform: translateY(-2px);
  filter: brightness(1.03);
}

button.secondary {
  background: #ffffff;
  color: var(--ink);
  border: 1px solid var(--line);
  box-shadow: 0 10px 24px rgba(31, 41, 55, .08);
}

button.danger {
  background: linear-gradient(180deg, #5f18c9, var(--violet-dark));
  color: #ffffff;
  box-shadow: 0 12px 26px rgba(76, 13, 170, .24);
}

main {
  padding: 0 42px 52px;
}

.status {
  display: flex;
  gap: 14px;
  align-items: center;
  flex-wrap: wrap;
  margin: 16px 0 22px;
}

.pill {
  background: rgba(255, 255, 255, .82);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 10px 16px;
  color: var(--muted);
  font-weight: 850;
  box-shadow: 0 8px 20px rgba(31, 41, 55, .06);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(74px, 1fr));
  gap: 16px;
  max-width: 1900px;
}

.tile {
  aspect-ratio: 1.25 / 1;
  border-radius: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff;
  color: #4b5563;
  border: 1px solid rgba(217, 222, 234, .9);
  box-shadow: 0 14px 34px rgba(31, 41, 55, .08);
  font-size: 28px;
  font-weight: 950;
  cursor: pointer;
  transition: .16s ease;
}

.tile:hover {
  transform: translateY(-3px);
  background: var(--violet-soft);
  color: var(--violet-dark);
  box-shadow: 0 18px 40px rgba(139, 28, 255, .16);
}

.tile.used {
  background: linear-gradient(180deg, #9e2cff, var(--violet));
  color: #ffffff;
  text-decoration: line-through;
  border-color: transparent;
  box-shadow: 0 18px 42px rgba(139, 28, 255, .28);
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(245, 246, 250, .72);
  backdrop-filter: blur(10px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 10;
}

.modal.open { display: flex; }

.card {
  width: min(980px, 96vw);
  background: #ffffff;
  border: 1px solid rgba(217, 222, 234, .95);
  border-radius: 34px;
  padding: 30px;
  box-shadow: var(--shadow);
}

.cardTop {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  align-items: start;
  border-bottom: 1px solid var(--line);
  padding-bottom: 18px;
  margin-bottom: 18px;
}

.num {
  font-size: 18px;
  color: var(--violet);
  font-weight: 950;
  text-transform: uppercase;
  letter-spacing: .6px;
}

.cat {
  margin-top: 4px;
  font-size: 13px;
  color: var(--muted);
  font-weight: 750;
}

.close {
  background: #ffffff;
  color: var(--ink);
  box-shadow: 0 8px 20px rgba(31, 41, 55, .08);
  border: 1px solid var(--line);
}

.question {
  font-size: clamp(28px, 4vw, 48px);
  line-height: 1.08;
  font-weight: 950;
  margin: 14px 0 20px;
  color: var(--ink);
}

.answer {
  display: none;
  background: linear-gradient(180deg, #f7f3ff, #ffffff);
  border-left: 7px solid var(--violet);
  padding: 18px;
  border-radius: 18px;
  color: #374151;
  font-size: 22px;
  line-height: 1.45;
}

.answer.show { display: block; }

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 20px;
}

.footerLogo {
  position: fixed;
  right: 26px;
  bottom: 18px;
  z-index: 2;
  width: 105px;
  opacity: .65;
  pointer-events: none;
}

.footerLogo img {
  display: block;
  width: 100%;
  height: auto;
  filter: invert(19%) sepia(92%) saturate(3560%) hue-rotate(235deg) brightness(98%) contrast(94%);
}

@media (max-width: 700px) {
  .top, main { padding-left: 18px; padding-right: 18px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 10px; }
  .tile { font-size: 21px; border-radius: 18px; }
  .footerLogo { width: 82px; right: 14px; bottom: 12px; }
}

</style>
</head>
<body>
  <header class="top">
    <div>
      <h1>Final Oral<br>Diseño de Experiencia de Usuario</h1>
      <p class="subtitle">Tablero aleatorio con preguntas independientes. Al tocar un número, queda tachado.</p>
    </div>
    <div class="controls">
      <button id="newRound">Nueva tanda</button>
      <button class="secondary" id="clearUsed">Limpiar tachados</button>
      <button class="danger" id="resetAll">Reiniciar y mezclar</button>
    </div>
  </header>
  <main>
    <div class="status">
      <span class="pill" id="counter">0 usadas</span>
      <span class="pill" id="total"></span>
      <span class="pill">Tip: “Nueva tanda” mezcla preguntas y limpia el tablero. “Limpiar tachados” mantiene el orden.</span>
    </div>
    <section class="grid" id="grid"></section>
  </main>
  <div class="modal" id="modal">
    <article class="card">
      <div class="cardTop">
        <div>
          <div class="num" id="modalNum"></div>

      <div class="question" id="question"></div>
      <div class="answer" id="answer"></div>
      <div class="actions">
        <button id="showAnswer">Mostrar respuesta esperada</button>
        <button class="secondary" id="markClose">Cerrar</button>
      </div>
    </article>
  </div>

  <script>
const QUESTIONS = [
  {
    "q": "¿Qué es la Experiencia de Usuario (UX)?",
    "a": "Es el conjunto de percepciones, sensaciones y respuestas que una persona tiene antes, durante y después de interactuar con un producto, sistema o servicio.",
    "cat": "Fundamentos"
  },
  {
    "q": "¿Cuál es la diferencia entre UX y UI?",
    "a": "UI es la interfaz visible: pantallas, botones, colores, tipografías y componentes. UX es más amplio: incluye la experiencia completa del usuario.",
    "cat": "Fundamentos"
  },
  {
    "q": "¿Cuál es la diferencia entre UX y usabilidad?",
    "a": "La usabilidad mide facilidad, eficiencia y satisfacción de uso. UX incluye también emociones, expectativas, contexto y percepción general.",
    "cat": "Fundamentos"
  },
  {
    "q": "¿Qué significa Diseño Centrado en el Usuario (DCU)?",
    "a": "Es un enfoque que coloca al usuario en el centro del proceso de diseño, validando decisiones con investigación y pruebas.",
    "cat": "Fundamentos"
  },
  {
    "q": "¿Por qué no conviene diseñar únicamente por intuición?",
    "a": "Porque la intuición puede estar sesgada. En UX hay que validar hipótesis con usuarios reales, investigación y pruebas.",
    "cat": "Fundamentos"
  },
  {
    "q": "¿Qué hace un diseñador UX?",
    "a": "Investiga usuarios, analiza necesidades, organiza información, diseña recorridos, crea wireframes/prototipos, testea y mejora la experiencia.",
    "cat": "Fundamentos"
  },
  {
    "q": "¿Qué rol puede tener un diseñador UX en una empresa chica?",
    "a": "Suele tener un rol integral: investiga, diseña, prototipa, testea, organiza contenidos y coordina con otras áreas.",
    "cat": "Fundamentos"
  },
  {
    "q": "¿Qué es la carga cognitiva?",
    "a": "Es el esfuerzo mental que una persona debe hacer para entender y usar una interfaz. Un buen diseño intenta reducirla.",
    "cat": "Fundamentos"
  },
  {
    "q": "¿Qué es un modelo mental?",
    "a": "Es la idea previa que tiene el usuario sobre cómo cree que funciona un sistema, basada en experiencias anteriores.",
    "cat": "Fundamentos"
  },
  {
    "q": "¿Por qué es importante respetar el modelo mental del usuario?",
    "a": "Porque si la interfaz funciona de forma muy distinta a lo esperado, aumenta la confusión y la carga cognitiva.",
    "cat": "Fundamentos"
  },
  {
    "q": "¿Cuál es la diferencia entre memoria operativa y memoria a largo plazo?",
    "a": "La memoria operativa retiene información por poco tiempo para tareas inmediatas. La de largo plazo guarda aprendizajes y experiencias previas.",
    "cat": "Fundamentos"
  },
  {
    "q": "Dame un ejemplo de memoria a largo plazo aplicada a una interfaz.",
    "a": "Usar patrones conocidos: carrito para compra, lupa para búsqueda, flecha para volver o menú hamburguesa en mobile.",
    "cat": "Fundamentos"
  },
  {
    "q": "¿Qué plantea Steve Krug con la frase “No me hagas pensar”?",
    "a": "Que una interfaz debe ser clara e intuitiva. El usuario no debería esforzarse para entender qué hacer.",
    "cat": "Krug"
  },
  {
    "q": "¿Por qué “No me hagas pensar” es una regla central de usabilidad?",
    "a": "Porque si el usuario debe pensar demasiado, se frustra, pierde tiempo y puede abandonar la tarea.",
    "cat": "Krug"
  },
  {
    "q": "Según Krug, ¿los usuarios leen o escanean las páginas?",
    "a": "Generalmente escanean. Buscan señales visuales, palabras clave y opciones útiles antes de leer en profundidad.",
    "cat": "Krug"
  },
  {
    "q": "¿Qué significa diseñar páginas para escanear y no solo para leer?",
    "a": "Organizar información con jerarquía, títulos claros, bloques breves, botones visibles y palabras clave fáciles de detectar.",
    "cat": "Krug"
  },
  {
    "q": "¿Qué relación hay entre Krug y la carga cognitiva?",
    "a": "Krug propone reducir el esfuerzo mental del usuario. Eso coincide con disminuir la carga cognitiva.",
    "cat": "Krug"
  },
  {
    "q": "¿Qué sería una interfaz que obliga demasiado a pensar?",
    "a": "Menús ambiguos, botones sin etiqueta clara, formularios largos, navegación escondida o textos internos que el usuario no entiende.",
    "cat": "Krug"
  },
  {
    "q": "¿Qué significa “no me hagas perder el tiempo” en UX?",
    "a": "Que la interfaz debe permitir completar tareas de manera rápida y clara, evitando pasos innecesarios.",
    "cat": "Krug"
  },
  {
    "q": "¿Qué significa “no me hagas hablar” aplicado a formularios?",
    "a": "No pedir información innecesaria; reducir campos, usar autocompletado y solicitar solo lo imprescindible.",
    "cat": "Krug"
  },
  {
    "q": "¿Por qué Krug insiste en eliminar palabras innecesarias?",
    "a": "Porque los textos largos dificultan el escaneo, aumentan la carga cognitiva y retrasan la comprensión.",
    "cat": "Krug"
  },
  {
    "q": "¿Qué significa que la usabilidad muchas veces es sentido común?",
    "a": "Que muchos problemas se detectan observando si una persona puede usar algo sin frustrarse, aunque para el equipo no sea evidente.",
    "cat": "Krug"
  },
  {
    "q": "¿Qué son las convenciones en diseño web?",
    "a": "Patrones que los usuarios ya conocen: logo arriba, menú, lupa de búsqueda, carrito o botón de volver.",
    "cat": "Krug"
  },
  {
    "q": "¿Por qué los usuarios valoran las convenciones?",
    "a": "Porque permiten usar una interfaz sin aprender todo desde cero. Reducen esfuerzo y ayudan a orientarse.",
    "cat": "Krug"
  },
  {
    "q": "¿Cuándo puede ser riesgoso romper una convención?",
    "a": "Cuando el cambio no aporta valor y solo genera confusión o dificultad para completar tareas.",
    "cat": "Krug"
  },
  {
    "q": "¿Qué son las heurísticas de Nielsen?",
    "a": "Son principios generales de usabilidad que sirven para evaluar interfaces y detectar problemas de diseño.",
    "cat": "Heurísticas"
  },
  {
    "q": "¿Qué es un análisis heurístico?",
    "a": "Es una evaluación experta que compara una interfaz con principios de usabilidad para detectar problemas.",
    "cat": "Heurísticas"
  },
  {
    "q": "¿Qué errores comunes puede detectar un análisis heurístico?",
    "a": "Navegación confusa, falta de feedback, lenguaje poco claro, inconsistencias, errores en formularios o acciones difíciles de encontrar.",
    "cat": "Heurísticas"
  },
  {
    "q": "¿Un análisis heurístico garantiza una buena UX?",
    "a": "No. Ayuda a detectar problemas, pero debe complementarse con pruebas con usuarios reales.",
    "cat": "Heurísticas"
  },
  {
    "q": "¿Cuál es la diferencia entre análisis heurístico y test de usabilidad?",
    "a": "El análisis heurístico lo realiza un evaluador experto. El test observa usuarios reales usando el producto.",
    "cat": "Heurísticas"
  },
  {
    "q": "¿Qué significa visibilidad del estado del sistema?",
    "a": "El sistema debe informar qué está pasando: carga, error, confirmación, avance o resultado de una acción.",
    "cat": "Heurísticas"
  },
  {
    "q": "Dame un ejemplo de visibilidad del estado del sistema.",
    "a": "Una barra de progreso, un mensaje de archivo cargado, un spinner o una confirmación de compra.",
    "cat": "Heurísticas"
  },
  {
    "q": "¿Qué significa hablar el lenguaje del usuario?",
    "a": "Usar palabras, conceptos y categorías comprensibles para el usuario, evitando jerga técnica o interna.",
    "cat": "Heurísticas"
  },
  {
    "q": "¿Qué hay que evitar al hablar el lenguaje del usuario?",
    "a": "Tecnicismos, siglas internas, nombres de áreas o procesos que el usuario no reconoce.",
    "cat": "Heurísticas"
  },
  {
    "q": "¿Qué significa consistencia en una interfaz?",
    "a": "Que elementos similares se vean y funcionen de la misma manera en todo el sistema.",
    "cat": "Heurísticas"
  },
  {
    "q": "¿Por qué la consistencia mejora la usabilidad?",
    "a": "Porque permite que el usuario aprenda una vez y aplique ese aprendizaje en otras partes de la interfaz.",
    "cat": "Heurísticas"
  },
  {
    "q": "¿Qué significa prevención de errores?",
    "a": "Diseñar para evitar que el usuario cometa errores antes de que ocurran, con restricciones, validaciones y mensajes claros.",
    "cat": "Heurísticas"
  },
  {
    "q": "Dame un ejemplo de prevención de errores.",
    "a": "Deshabilitar un botón hasta completar campos obligatorios, validar un mail o pedir confirmación antes de borrar algo.",
    "cat": "Heurísticas"
  },
  {
    "q": "¿Qué significa recuperación ante errores?",
    "a": "Que el sistema ayude al usuario a entender el error y corregirlo fácilmente.",
    "cat": "Heurísticas"
  },
  {
    "q": "¿Qué diferencia hay entre prevenir un error y mostrar un mensaje de error?",
    "a": "Prevenir evita que el error ocurra. El mensaje aparece después y debe ayudar a corregirlo.",
    "cat": "Heurísticas"
  },
  {
    "q": "¿Qué significa reconocimiento antes que recuerdo?",
    "a": "La interfaz debe mostrar opciones visibles para que el usuario no tenga que memorizar información o pasos.",
    "cat": "Heurísticas"
  },
  {
    "q": "¿Qué heurística se relaciona con reducir la memoria que debe usar el usuario?",
    "a": "Reconocimiento antes que recuerdo.",
    "cat": "Heurísticas"
  },
  {
    "q": "¿Qué significa control y libertad del usuario?",
    "a": "El usuario debe poder deshacer, volver atrás o salir de una acción sin quedar atrapado.",
    "cat": "Heurísticas"
  },
  {
    "q": "¿Qué significa diseño estético y minimalista?",
    "a": "Mostrar solo la información necesaria, evitando ruido visual y elementos que no aportan a la tarea.",
    "cat": "Heurísticas"
  },
  {
    "q": "¿Cuál considera que es la heurística más fuerte? Justifique.",
    "a": "No hay única respuesta. Debe elegir una heurística y justificarla con un ejemplo claro.",
    "cat": "Heurísticas"
  },

  <script>

const KEY = "final_oral_ux_v1";
function shuffle(array){const a=[...array];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function balancedShuffle(){const groups={};QUESTIONS.forEach((q,index)=>{const cat=q.cat||"General";if(!groups[cat])groups[cat]=[];groups[cat].push(index);});Object.keys(groups).forEach(cat=>{groups[cat]=shuffle(groups[cat]);});const order=[];const cats=shuffle(Object.keys(groups));while(order.length<QUESTIONS.length){for(const cat of cats){if(groups[cat].length){order.push(groups[cat].pop());}}}return order;}
function defaultState(){return{order:balancedShuffle(),used:[]};}
function loadState(){try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.order&&saved.order.length===QUESTIONS.length){return saved;}}catch(error){}return defaultState();}
function saveState(){localStorage.setItem(KEY,JSON.stringify(state));}
let state=loadState();
function render(){const grid=document.getElementById("grid");grid.innerHTML="";state.order.forEach((questionIndex,boardIndex)=>{const tile=document.createElement("div");tile.className="tile"+(state.used.includes(boardIndex)?" used":"");tile.textContent=boardIndex+1;tile.onclick=()=>openQuestion(boardIndex);grid.appendChild(tile);});document.getElementById("counter").textContent=`${state.used.length} usadas`;document.getElementById("total").textContent=`${QUESTIONS.length} preguntas`;}
function openQuestion(boardIndex){const questionIndex=state.order[boardIndex];const item=QUESTIONS[questionIndex];if(!state.used.includes(boardIndex)){state.used.push(boardIndex);saveState();render();}document.getElementById("modalNum").textContent=`Número ${boardIndex+1}`;document.getElementById("category").textContent=item.cat||"";document.getElementById("question").textContent=item.q;document.getElementById("answer").textContent=item.a;const answer=document.getElementById("answer");answer.classList.remove("show");document.getElementById("showAnswer").textContent="Mostrar respuesta esperada";document.getElementById("modal").classList.add("open");}
function closeModal(){document.getElementById("modal").classList.remove("open");}
document.getElementById("close").onclick=closeModal;document.getElementById("markClose").onclick=closeModal;document.getElementById("showAnswer").onclick=()=>{const answer=document.getElementById("answer");const shouldShow=!answer.classList.contains("show");answer.classList.toggle("show",shouldShow);document.getElementById("showAnswer").textContent=shouldShow?"Ocultar respuesta":"Mostrar respuesta esperada";};
document.getElementById("newRound").onclick=()=>{if(confirm("¿Mezclar preguntas y limpiar tachados para una nueva tanda?")){state=defaultState();saveState();render();}};
document.getElementById("clearUsed").onclick=()=>{state.used=[];saveState();render();};
document.getElementById("resetAll").onclick=()=>{if(confirm("¿Reiniciar y mezclar? Esto borra el estado guardado, mezcla preguntas y limpia tachados.")){localStorage.removeItem(KEY);state=defaultState();render();}};
document.addEventListener("keydown",event=>{if(event.key==="Escape")closeModal();if(event.key.toLowerCase()==="r")document.getElementById("showAnswer").click();});render();

</script>
