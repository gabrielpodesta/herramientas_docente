<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Final Oral - Diseño de Información</title><style>:root{--ink:#f4f8fb;--muted:#aebdca;--accent:#00a6c8;--accent2:#c4429b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 85% 10%,#c4429b 0,#018e9b 34%,#07131f 88%,#050b12 100%);color:var(--ink);min-height:100vh}header{padding:28px 36px 14px;display:flex;gap:22px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}h1{margin:0;font-size:clamp(28px,4vw,54px);line-height:.95;letter-spacing:-1.5px}.sub{color:var(--muted);font-size:16px;margin-top:8px}.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}button{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer;background:#f4f8fb;color:#07131f;box-shadow:0 8px 24px rgba(0,0,0,.2)}button.secondary{background:#13263b;color:#f4f8fb;border:1px solid rgba(255,255,255,.12)}button.danger{background:#531b42;color:#fff}main{padding:0 36px 42px}.status{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:14px 0 18px}.pill{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:9px 15px;color:var(--muted);font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:15px;max-width:1900px}.tile{aspect-ratio:1/.88;border-radius:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#12b6cf,#067c92);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 10px 22px rgba(0,0,0,.22);font-size:30px;font-weight:950;color:white;cursor:pointer;transition:.15s}.tile:hover{transform:translateY(-2px);filter:brightness(1.08)}.tile.used{background:linear-gradient(180deg,#c4429b,#7a235f);text-decoration:line-through;opacity:.75}.modal{position:fixed;inset:0;background:rgba(2,8,14,.72);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}.modal.open{display:flex}.card{width:min(900px,96vw);background:#0d1f31;border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.45)}.cardTop{display:flex;justify-content:space-between;gap:18px;align-items:start;border-bottom:1px solid rgba(255,255,255,.14);padding-bottom:16px;margin-bottom:16px}.num{font-size:18px;color:#64d8ea;font-weight:950;text-transform:uppercase;letter-spacing:.6px}.close{background:#13263b;color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.12)}.question{font-size:clamp(26px,4vw,46px);line-height:1.08;font-weight:950;margin:14px 0 20px}.answer{display:none;background:rgba(255,255,255,.07);border-left:5px solid var(--accent2);padding:17px;border-radius:14px;color:#e7f2f7;font-size:21px;line-height:1.45}.answer.show{display:block}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.footerLogo{position:fixed;right:24px;bottom:18px;width:105px;opacity:.88;pointer-events:none;z-index:2}.footerLogo img{display:block;width:100%;height:auto}@media(max-width:700px){header,main{padding-left:18px;padding-right:18px}.grid{grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:10px}.tile{font-size:23px}.footerLogo{width:82px;right:14px;bottom:12px}}</style></head><body><header><div><h1>Final Oral<br>Diseño de Información</h1><div class="sub">Tablero aleatorio con preguntas independientes. Al tocar un número, queda tachado.</div></div><div class="controls"><button id="newRound">Nueva tanda</button><button class="secondary" id="clearUsed">Limpiar tachados</button><button class="danger" id="resetAll">Reiniciar y mezclar</button></div></header><main><div class="status"><span class="pill" id="counter">0 usadas</span><span class="pill" id="total"></span><span class="pill">Tip: “Nueva tanda” mezcla preguntas y limpia el tablero. “Limpiar tachados” mantiene el orden.</span></div><section class="grid" id="grid">< ?", "a": "Diferencia elementos, destaca información importante y mejora la legibilidad."}, {"q": "¿Qué es la jerarquía tipográfica?", "a": "El uso de tamaños, pesos, estilos y posiciones para ordenar títulos, subtítulos, texto, epígrafes y destacados."}, {"q": "Dé ejemplos de jerarquía tipográfica.", "a": "Título grande y bold, subtítulo menor, cuerpo regular, epígrafes pequeños y datos destacados en negrita."}, {"q": "¿Qué son las marcas tipográficas?", "a": "Recursos que ayudan a organizar o destacar información: negritas, itálicas, versalitas, capitulares, destacados, filetes o viñetas."}, {"q": "¿Cómo pueden expresarse las marcas tipográficas?", "a": "Con peso, tamaño, color, estilo, caja alta, interlineado, sangrías, recuadros o separación espacial."}, {"q": "¿Qué sería un delito tipográfico?", "a": "Un uso descuidado: deformar letras, abusar de fuentes, usar mayúsculas sin criterio o generar mala legibilidad."}, {"q": "¿Cuál es la diferencia entre sans serif y serif?", "a": "Las serif tienen remates en los extremos; las sans serif no los tienen y suelen verse más limpias."}, {"q": "¿Qué es una familia tipográfica?", "a": "Un conjunto de variantes de una misma tipografía: regular, bold, light, italic, condensed, black, etc."}, {"q": "¿Para qué sirve un sistema de diseño?", "a": "Para mantener coherencia visual y funcional mediante reglas de tipografía, color, componentes, grillas y estilos."}, {"q": "¿Qué es una grilla o retícula?", "a": "Una estructura de líneas, columnas y módulos que ordena la composición."}, {"q": "¿Qué ventajas tiene trabajar con grilla?", "a": "Orden, consistencia, alineación, claridad y facilidad de lectura."}, {"q": "¿Qué significa la altura de la X?", "a": "La altura de las minúsculas sin ascendentes ni descendentes, como la x."}, {"q": "¿Qué es el interlineado?", "a": "El espacio vertical entre líneas de texto."}, {"q": "¿Cómo se calcula o define el interlineado?", "a": "Se define en relación con el cuerpo tipográfico; suele ser algo mayor que el tamaño de la letra."}, {"q": "¿Qué es una ascendente?", "a": "Parte de una minúscula que supera la altura de x, como b, d, h o l."}, {"q": "¿Qué es una descendente?", "a": "Parte de una minúscula que baja de la línea base, como g, j, p, q o y."}, {"q": "¿Cómo se llama el espacio entre letras?", "a": "Tracking o espaciado; si se ajustan pares específicos, kerning."}, {"q": "¿Dónde se pueden encontrar fuentes tipográficas?", "a": "Google Fonts, Adobe Fonts, Font Squirrel, MyFonts o Typewolf."}, {"q": "¿Qué es Helvetica y por qué es importante?", "a": "Tipografía sans serif suiza de 1957, influyente por su claridad, neutralidad y uso en diseño corporativo."}, {"q": "¿Qué son los colores CMYK?", "a": "Cian, magenta, amarillo y negro; sistema usado principalmente para impresión."}, {"q": "¿Qué codificación se usa para colores web?", "a": "RGB, hexadecimal o HSL; por ejemplo #FFFFFF."}, {"q": "¿Cómo se expresan los colores para impresión?", "a": "En porcentajes de CMYK."}, {"q": "¿Cuál es la diferencia entre RGB y CMYK?", "a": "RGB se usa en pantallas con luz; CMYK se usa en impresión con tintas."}, {"q": "¿Qué es el diseño editorial?", "a": "Organización visual de contenidos en libros, revistas, diarios, informes o piezas digitales."}, {"q": "¿El contenido precede al diseño?", "a": "Sí. El diseño debe responder al contenido y ayudar a comunicarlo mejor."}, {"q": "¿Cuáles son elementos de diseño editorial?", "a": "Título, bajada, cuerpo, imágenes, epígrafes, destacados, columnas, folios, blancos, grilla e infografías."}, {"q": "¿Qué tipos de imágenes pueden aparecer en diseño editorial?", "a": "Fotografías, ilustraciones, infografías, mapas, gráficos, íconos, diagramas y capturas."}, {"q": "¿Para qué sirve una línea de tiempo?", "a": "Para mostrar hechos ordenados cronológicamente y comprender secuencias, evolución o duración."}, {"q": "¿Cuándo conviene usar una línea de tiempo?", "a": "Cuando el eje temporal es clave para entender una historia, proceso o investigación."}, {"q": "¿Qué asociaciones pueden generar los colores?", "a": "Pueden sugerir tono, tema o identidad: urgencia, institucionalidad, ambiente, dramatismo, etc."}, {"q": "¿Por qué no alcanza con elegir colores solo por gusto?", "a": "Porque el color comunica, jerarquiza y afecta legibilidad; debe responder a contenido, audiencia y soporte."}, {"q": "¿Qué relación puede tener el rojo con una publicación?", "a": "Impacto, alerta, energía, conflicto, política, deporte o urgencia según contexto."}, {"q": "¿Qué puede comunicar rojo y amarillo?", "a": "Energía, impacto, advertencia, dinamismo o tono comercial; puede resultar estridente."}, {"q": "¿Qué puede comunicar rojo y blanco?", "a": "Alto contraste, limpieza visual y comunicación directa."}, {"q": "¿Qué puede comunicar rojo y verde?", "a": "Contraste fuerte, tensión, ambiente o códigos culturales; debe cuidarse por accesibilidad."}, {"q": "¿Qué puede comunicar rojo y negro?", "a": "Dramatismo, fuerza, elegancia, conflicto o intensidad."}, {"q": "¿Qué puede comunicar rojo y azul?", "a": "Política, institucionalidad, deporte, contraste ideológico o tensión visual."}, {"q": "¿Quién fue John Snow?", "a": "Médico que investigó el brote de cólera de Londres en 1854 usando datos y un mapa."}, {"q": "¿Qué mostró el mapa de John Snow?", "a": "Que las muertes se concentraban alrededor de la bomba de Broad Street."}, {"q": "¿Qué detecta el cerebro al comparar círculos?", "a": "Tiende a comparar diámetros más que áreas, por eso puede interpretar mal diferencias."}, {"q": "¿Por qué puede ser problemático usar círculos para comparar datos?", "a": "Porque las áreas son difíciles de comparar con precisión; muchas veces convienen barras."}, {"q": "¿Cuánto debe sumar un gráfico de tortas?", "a": "Debe sumar 100%, porque representa partes de un total."}, {"q": "¿Cuándo conviene usar un gráfico de tortas?", "a": "Con pocas categorías que forman parte de un total y diferencias claras."}, {"q": "¿Qué diferencia hay entre barras y columnas?", "a": "Ambos comparan valores; barras son horizontales y columnas verticales."}, {"q": "¿Qué es una barra apilada?", "a": "Una barra dividida en segmentos que muestran composición interna o partes de un total."}, {"q": "¿Qué condición debe cumplir una barra apilada porcentual?", "a": "Cada barra debe representar 100%."}, {"q": "¿Qué es un gráfico de evolución?", "a": "Un gráfico que muestra cambios a lo largo del tiempo, como una línea de fiebre."}, {"q": "¿Para qué sirve un mapa?", "a": "Para representar información geográfica, ubicar fenómenos y mostrar patrones territoriales."}, {"q": "¿Qué significa mapear?", "a": "Ubicar, representar o relacionar información en un territorio o sistema espacial."}, {"q": "¿Cuándo conviene usar gráfico de puntos?", "a": "Para mostrar distribución, relación entre variables, concentración o dispersión."}, {"q": "¿Qué son mapas de calor?", "a": "Visualizaciones que muestran concentración o intensidad mediante cambios de color."}, {"q": "¿Qué integra un SIG?", "a": "Datos geográficos, software, hardware, personas, métodos y sistemas de referencia espacial."}, {"q": "¿Qué necesito para ubicar puntos en un mapa?", "a": "Coordenadas, generalmente latitud y longitud, y un sistema de referencia correcto."}, {"q": "Dé ejemplos de objetos vectoriales.", "a": "Hospitales como puntos, rutas como líneas y provincias como polígonos."}, {"q": "Dé ejemplos de objetos ráster.", "a": "Imágenes satelitales, modelos de elevación, fotografías aéreas o grillas de temperatura."}, {"q": "¿Cuál es la diferencia entre vectorial y ráster?", "a": "Vectorial usa puntos, líneas y polígonos; ráster usa celdas o píxeles."}, {"q": "¿En qué campos se usan los SIG?", "a": "Urbanismo, ambiente, transporte, salud, seguridad, periodismo, catastro, logística y gestión de riesgos."}, {"q": "¿Cómo midió Eratóstenes la circunferencia terrestre?", "a": "Comparó sombras en dos ciudades y usó geometría con la distancia entre ellas."}, {"q": "¿Qué representa el gráfico de Minard sobre Napoleón?", "a": "La campaña de Napoleón en Rusia y la reducción del ejército durante avance y retirada."}, {"q": "¿Qué variables integra el gráfico de Minard?", "a": "Recorrido, tamaño del ejército, dirección, tiempo, temperatura y ubicación."}, {"q": "¿Por qué es importante el gráfico de Minard?", "a": "Cuenta una historia compleja combinando muchas variables de forma clara y narrativa."}, {"q": "¿Quién fue Mercator?", "a": "Cartógrafo flamenco conocido por desarrollar una proyección usada para navegación."}, {"q": "¿Para qué fue útil la proyección Mercator?", "a": "Para navegación, porque permite representar rumbos como líneas rectas."}, {"q": "¿Qué mapas actuales usan una variante de Mercator?", "a": "Muchos mapas web, como Google Maps u OpenStreetMap, usan Web Mercator."}, {"q": "¿Qué es una proyección geográfica?", "a": "Método para representar la superficie curva de la Tierra en un plano."}, {"q": "¿Por qué ninguna proyección es perfecta?", "a": "Porque siempre deforma áreas, formas, distancias o direcciones."}, {"q": "¿Qué sistema se usa habitualmente en Argentina para datos geográficos?", "a": "POSGAR; también EPSG:4326 para coordenadas geográficas y fajas Gauss-Krüger locales."}, {"q": "¿Qué se puede hacer con un mapa en comunicación?", "a": "Ubicar, comparar, explicar recorridos, mostrar patrones y narrar procesos territoriales."}, {"q": "¿Qué es la visualización de datos?", "a": "Representación visual de datos para facilitar análisis, comprensión y comunicación."}, {"q": "¿Cuál es la diferencia entre dato e información?", "a": "El dato es una unidad básica; la información surge al organizarlo, contextualizarlo e interpretarlo."}, {"q": "¿Qué diferencia hay entre infografía e ilustración?", "a": "La infografía explica información y relaciones; la ilustración representa o acompaña una idea."}, {"q": "¿Qué significa reducir la carga cognitiva?", "a": "Diseñar para entender con menos esfuerzo, evitando ruido visual y exceso de información."}, {"q": "¿Qué es la legibilidad?", "a": "Facilidad para distinguir letras y palabras según tipografía, tamaño, contraste e interlineado."}, {"q": "¿Qué es la lecturabilidad?", "a": "Facilidad general de lectura y comprensión de un texto y su estructura."}, {"q": "¿Qué es figura-fondo?", "a": "La capacidad de distinguir claramente un elemento principal del fondo."}, {"q": "¿Por qué no conviene usar demasiadas tipografías?", "a": "Genera ruido visual, falta de coherencia y dificulta la jerarquía."}, {"q": "¿Qué significa alineación visual?", "a": "Ordenar elementos sobre ejes comunes para dar claridad y estructura."}, {"q": "¿Qué función cumple el espacio en blanco?", "a": "Separa, jerarquiza y da descanso visual; es parte activa del diseño."}, {"q": "¿Qué es un mapa temático?", "a": "Mapa que representa un fenómeno específico, como votos, pobreza, temperatura o tránsito."}, {"q": "¿Qué es un mapa coroplético?", "a": "Mapa que colorea áreas según el valor de una variable."}, {"q": "¿Qué es un mapa de símbolos proporcionales?", "a": "Mapa que representa valores con símbolos de distinto tamaño."}, {"q": "¿Qué significa que una visualización sea autoexplicativa?", "a": "Que se entiende gracias a título, etiquetas, leyendas, escalas y organización clara."}, {"q": "¿Qué son las narrativas transmedia?", "a": "Relatos que se expanden en distintos medios o plataformas, donde cada pieza aporta algo."}, {"q": "Dé ejemplos de narrativas transmedia.", "a": "Harry Potter, Star Wars, Marvel o campañas que combinan redes, videos, experiencias y sitios."}, {"q": "¿Qué es un scrollytelling?", "a": "Narrativa digital donde el contenido se despliega progresivamente al hacer scroll."}, {"q": "¿Qué elemento es necesario para una narrativa digital?", "a": "Una historia estructurada, una audiencia y un soporte digital con lenguajes o interacción."}, {"q": "¿Qué diferencia hay entre diseñar para imprimir y para pantalla?", "a": "Impresión usa CMYK, papel y medidas físicas; pantalla usa RGB, responsive e interacción."}, {"q": "¿Qué es un dashboard?", "a": "Interfaz que reúne indicadores, gráficos y datos clave para monitorear o analizar una situación."}, {"q": "¿Qué debe evitar un dashboard?", "a": "Exceso de indicadores, gráficos innecesarios, poca jerarquía, colores confusos y falta de contexto."}, {"q": "¿Por qué el título es importante en una visualización?", "a": "Orienta la lectura, indica el tema y puede destacar el hallazgo principal."}, {"q": "¿Qué es una portada editorial?", "a": "Es la primera página o pantalla de una publicación y debe presentar identidad, tema principal, jerarquía y atractivo visual."}, {"q": "¿Qué función cumple un epígrafe?", "a": "Acompaña una imagen o gráfico, aporta contexto y ayuda a interpretar correctamente lo que se muestra."}, {"q": "¿Qué diferencia hay entre ordenar y diseñar información?", "a": "Ordenar es disponer elementos; diseñar información implica jerarquizar, seleccionar, relacionar y presentar contenidos para facilitar comprensión."}];const KEY='final_oral_diseno_informacion_v1';function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}function defaultState(){return{order:shuffle([...Array(QUESTIONS.length).keys()]),used:[]}}function loadState(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.order&&s.order.length===QUESTIONS.length)return s;}catch(e){}return defaultState();}function save(){localStorage.setItem(KEY,JSON.stringify(state));}let state=loadState();function render(){const grid=document.getElementById('grid');grid.innerHTML='';state.order.forEach((qIdx,boardIdx)=>{const b=document.createElement('div');b.className='tile'+(state.used.includes(boardIdx)?' used':'');b.textContent=boardIdx+1;b.onclick=()=>openQuestion(boardIdx);grid.appendChild(b);});document.getElementById('counter').textContent=state.used.length+' usadas';document.getElementById('total').textContent=QUESTIONS.length+' preguntas';}function openQuestion(boardIdx){const q=QUESTIONS[state.order[boardIdx]];if(!state.used.includes(boardIdx)){state.used.push(boardIdx);save();render();}document.getElementById('modalNum').textContent='Número '+(boardIdx+1);document.getElementById('realId').textContent='ID interno: D'+String(state.order[boardIdx]+1).padStart(3,'0');document.getElementById('question').textContent=q.q;document.getElementById('answer').textContent=q.a;document.getElementById('answer').classList.remove('show');document.getElementById('showAnswer').textContent='Mostrar respuesta esperada';document.getElementById('modal').classList.add('open');}function closeModal(){document.getElementById('modal').classList.remove('open')}document.getElementById('close').onclick=closeModal;document.getElementById('markClose').onclick=closeModal;document.getElementById('showAnswer').onclick=()=>{const ans=document.getElementById('answer');const show=!ans.classList.contains('show');ans.classList.toggle('show',show);document.getElementById('showAnswer').textContent=show?'Ocultar respuesta':'Mostrar respuesta esperada';};document.getElementById('newRound').onclick=()=>{if(confirm('¿Mezclar preguntas y limpiar tachados para una nueva tanda?')){state=defaultState();save();render();}};document.getElementById('clearUsed').onclick=()=>{state.used=[];save();render();};document.getElementById('resetAll').onclick=()=>{if(confirm('¿Reiniciar y mezclar? Esto borra el estado guardado, mezcla preguntas y limpia tachados.')){localStorage.removeItem(KEY);state=defaultState();render();}};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key.toLowerCase()==='r')document.getElementById('showAnswer').click();});render();</script></body></html>
